<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>TOTK Companion</title>
    
    <link rel="apple-touch-icon" href="icons/main-icon.png">
	<link rel="icon" type="image/png" href="icons/main-icon.png">
	
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0f19;
            color: #e2e8f0;
            overflow: hidden;
        }

        /* --- DASHBOARD VIEW --- */
        #dashboard {
            width: 100%;
            height: 100%;
            overflow-y: auto;
            box-sizing: border-box;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #4ade80;
            margin-bottom: 5px;
            text-align: center;
        }
        .subtitle {
            color: #94a3b8;
            margin-bottom: 30px;
            text-align: center;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 15px;
            width: 100%;
            max-width: 1000px;
            padding-bottom: 40px;
        }
        .region-card {
            background-color: #1e293b;
            border: 2px solid #334155;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .region-card:hover {
            background-color: #4ade80;
            color: #0f172a;
            transform: translateY(-2px);
            border-color: #4ade80;
        }

        /* --- MAP VIEWER VIEW --- */
        #mapViewer {
            display: none;
            position: relative;
            width: 100%;
            height: 100%;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            cursor: grab;
        }
        canvas:active { cursor: grabbing; }

        /* --- UI OVERLAYS --- */
        .ui-panel {
            position: absolute;
            z-index: 10;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 10px;
            display: flex;
            gap: 8px;
        }
        #topPanel {
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #regionTitle {
            margin: 0;
            font-size: 1.1rem;
            font-weight: bold;
            color: #4ade80;
        }
        .btn {
            background: #334155;
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
        .btn:hover { background: #475569; }
        .btn.back-btn { background: #ef4444; }
        .btn.back-btn:hover { background: #dc2626; }

        #layerPanel {
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .layer-btn {
            background: #1e293b;
            border: 1px solid #475569;
            color: #94a3b8;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.15s ease;
        }
        .layer-btn.active {
            background: #4ade80;
            color: #0f172a;
            border-color: #4ade80;
        }
        
        /* Coordinate/Landmark tooltip label overlay */
		#coordLabel {
			position: absolute;
			z-index: 12;
			background: rgba(15, 23, 42, 0.95);
			border: 1px solid #4ade80;
			color: #e2e8f0;
			padding: 8px 14px;
			border-radius: 6px;
			font-family: monospace;
			font-size: 0.85rem;
			line-height: 1.4;
			pointer-events: none; 
			display: none; 
			box-shadow: 0 4px 16px rgba(0,0,0,0.6);
		}
		.game-coords {
			color: #4ade80;
			font-weight: bold;
			display: block;
			margin-bottom: 4px;
		}
		.img-coords {
			color: #94a3b8;
			font-size: 0.75rem;
			display: block;
		}
        .landmark-title {
            color: #facc15;
            font-weight: bold;
            font-size: 1.1rem;
            display: block;
            margin-bottom: 2px;
        }
        /* --- FILTER MENU --- */
        #filterPanel {
            position: absolute;
            bottom: 25px;
            right: 15px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            z-index: 10;
        }
        #filterMenu {
            display: none;
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            flex-direction: column;
            gap: 12px;
            min-width: 160px;
        }
        .filter-label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 0.95rem;
            color: #e2e8f0;
            font-weight: 600;
        }
        .filter-label input {
            cursor: pointer;
            width: 16px;
            height: 16px;
            accent-color: #4ade80;
        }
    </style>
</head>
<body>

<div id="dashboard">
    <h1>Hyrule Map Companion</h1>
    <div class="subtitle">Select a region to explore its topography, skies, and depths</div>
    <div class="grid-container" id="regionGrid"></div>
</div>

<div id="mapViewer">
    <div id="topPanel" class="ui-panel">
        <button class="btn back-btn" onclick="exitToDashboard()">← Regions</button>
        <div id="regionTitle">Region Name</div>
        <div style="width: 80px;"></div> </div>

    <canvas id="mapCanvas"></canvas>
	<div id="coordLabel">X: 0, Y: 0</div>
	
    <div id="layerPanel" class="ui-panel">
        <button class="layer-btn" onclick="setLayer('sky')">Sky</button>
        <button class="layer-btn active" onclick="setLayer('surface')">Surface</button>
        <button class="layer-btn" onclick="setLayer('depths')">Depths</button>
    </div>
    <div id="filterPanel">
        <div id="filterMenu"></div>
        <button class="layer-btn" onclick="toggleFilterMenu()" id="filterBtn">Filters ⚙️</button>
    </div>
</div>

<script src="landmarks.js"></script>

<script>
    const REGIONS = [
        { id: 1, name: "North Hyrule Field", gameStartX: -1880, gameStartY: 1503 },
        { id: 2, name: "South Hyrule Field", gameStartX: -3194, gameStartY: 189 },
        { id: 3, name: "Hyrule Ridge", gameStartX: -4512, gameStartY: 3008 },
        { id: 4, name: "Hebra Mountains", gameStartX: -4888, gameStartY: 4135 },
        { id: 5, name: "Tabantha Tundra", gameStartX: -3196, gameStartY: 4136 },
        { id: 6, name: "Great Hyrule Forest", gameStartX: -1315, gameStartY: 4136 },
        { id: 7, name: "Eldin", gameStartX: 376, gameStartY: 4136 },
        { id: 8, name: "Akkala", gameStartX: 2633, gameStartY: 4136 },
        { id: 9, name: "Lanayru Great Spring", gameStartX: 1503, gameStartY: 1880 },
        { id: 10, name: "Lanayru Wetlands", gameStartX: 1, gameStartY: 1503 },
        { id: 11, name: "Mount Lanayru", gameStartX: 1880, gameStartY: 0 },
        { id: 12, name: "East Necluda", gameStartX: 1127, gameStartY: -1127 },
        { id: 13, name: "Faron Grasslands", gameStartX: -1503, gameStartY: -752 },
        { id: 14, name: "Gerudo Desert", gameStartX: -5639, gameStartY: -1129 },
        { id: 15, name: "Gerudo Highlands", gameStartX: -5640, gameStartY: 752 }
    ];

    let currentRegion = null;
    let currentLayer = 'surface'; 
    let activeImage = new Image();
    
    // Landmark Icons Dictionary
    const icons = {};
    const iconTypes = [
        "Tower", "Shrine", "Cave", "Chasm", "Dispenser", 
        "Hudson Sign", "Named Location", "Old Map", 
        "Lightroot", "Treasure Chest", "Yiga Hideout"
    ];
    
    iconTypes.forEach(type => {
        const img = new Image();
        // Formats "Hudson Sign" to "hudson-sign.png"
        const fileName = type.toLowerCase().replace(/\s+/g, '-'); 
        img.src = `icons/${fileName}.png`;
        icons[type] = img;
    });

    // Canvas Engine State
    const canvas = document.getElementById('mapCanvas');
    const ctx = canvas.getContext('2d');
    const coordLabel = document.getElementById('coordLabel');
    
    let scale = 1, minScale = 1, maxScale = 1.5;
    let offsetX = 0, offsetY = 0;
    let isDragging = false, startX, startY, initialPinchDist = 0, initialScale = 1;
    let dragMoveCounter = 0; 

    // MARKER STATE
    let markerX = null;
    let markerY = null;
    let selectedLandmark = null;
    
    // --- NEW FILTER & FORMATTING STATE ---
    let activeFilters = [];
    
    const FILTER_CONFIG = {
        surface: {
            options: { "Tower": "Towers", "Shrine": "Shrines", "Cave": "Caves", "Chasm": "Chasms", "Dispenser": "Dispensers", "Hudson Sign": "Hudson Signs", "Named Location": "Named Locations" },
            defaults: ["Tower", "Shrine"]
        },
        sky: {
            options: { "Shrine": "Shrines", "Dispenser": "Dispensers", "Old Map": "Old Maps" },
            defaults: ["Shrine"]
        },
        depths: {
            options: { "Lightroot": "Lightroots", "Treasure Chest": "Treasure Chests", "Yiga Hideout": "Yiga Hideouts" },
            defaults: ["Lightroot"]
        }
    };

    function toggleFilterMenu() {
        const menu = document.getElementById('filterMenu');
        menu.style.display = menu.style.display === 'flex' ? 'none' : 'flex';
    }

    function buildFilterMenu() {
        const menu = document.getElementById('filterMenu');
        menu.innerHTML = '';
        const config = FILTER_CONFIG[currentLayer];
        
        // Reset to default filters when switching layers
        activeFilters = [...config.defaults]; 
        
        Object.entries(config.options).forEach(([type, labelText]) => {
            const label = document.createElement('label');
            label.className = 'filter-label';
            
            const cb = document.createElement('input');
            cb.type = 'checkbox';
            cb.value = type;
            cb.checked = activeFilters.includes(type);
            cb.onchange = (e) => {
                if (e.target.checked) activeFilters.push(type);
                else activeFilters = activeFilters.filter(f => f !== type);
                redraw();
            };
            
            label.appendChild(cb);
            label.appendChild(document.createTextNode(labelText));
            menu.appendChild(label);
        });
    }

    function formatCoord(val) {
        // Formats to 4 digits with leading zeroes, maintaining the negative sign
        const sign = val < 0 ? '-' : '';
        return sign + Math.abs(Math.round(val)).toString().padStart(4, '0');
    }

    // Build Selection Dashboard
    const grid = document.getElementById('regionGrid');
    REGIONS.forEach(r => {
        const card = document.createElement('div');
        card.className = 'region-card';
        card.innerText = r.name;
        card.onclick = () => loadRegion(r);
        grid.appendChild(card);
    });

    function loadRegion(region) {
        currentRegion = region;
        currentLayer = 'surface';
        
        markerX = null;
        markerY = null;
        selectedLandmark = null;
        coordLabel.style.display = 'none';
        
        document.getElementById('regionTitle').innerText = region.name;
        document.getElementById('dashboard').style.display = 'none';
        document.getElementById('mapViewer').style.display = 'block';
        
        updateLayerUI();
        scale = -1; 
        updateMapAsset();
		document.getElementById('filterMenu').style.display = 'none';
		buildFilterMenu();
    }

    function setLayer(layer) {
        if (currentLayer === layer) return;
        currentLayer = layer;
        
        markerX = null;
        markerY = null;
        selectedLandmark = null;
        coordLabel.style.display = 'none';
        
        updateLayerUI();
        updateMapAsset();
		document.getElementById('filterMenu').style.display = 'none';
		buildFilterMenu();
    }

    function updateLayerUI() {
        document.querySelectorAll('.layer-btn').forEach(btn => {
            btn.classList.remove('active');
            if(btn.innerText.toLowerCase() === currentLayer) btn.classList.add('active');
        });
    }

    function updateMapAsset() {
        // Pads the ID with a zero if it's less than 10 (e.g., 1 -> "01") to match file paths
        const formattedId = currentRegion.id.toString().padStart(2, '0');
        const srcPath = `images/region${formattedId}${currentLayer}.png`;
        activeImage = new Image();
        activeImage.src = srcPath;
        activeImage.onload = () => {
            if (scale === -1) {
                resizeCanvas(true); 
            } else {
                redraw();
            }
        };
        activeImage.onerror = () => { redraw(); };
    }

    function exitToDashboard() {
        document.getElementById('mapViewer').style.display = 'none';
        document.getElementById('dashboard').style.display = 'flex';
        currentRegion = null;
        coordLabel.style.display = 'none';
    }

    function resizeCanvas(resetZoom = false) {
        if (!currentRegion) return;
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    
        if (resetZoom) {
            const shortestDeviceDim = Math.min(canvas.width, canvas.height);
            const mapDim = Math.max(activeImage.width, activeImage.height);
            
            minScale = shortestDeviceDim / (mapDim || 2000); 
            scale = minScale;
            
            offsetX = (canvas.width - (activeImage.width * scale)) / 2;
            offsetY = (canvas.height - (activeImage.height * scale)) / 2;
        } else {
            const shortestDeviceDim = Math.min(canvas.width, canvas.height);
            const mapDim = Math.max(activeImage.width, activeImage.height);
            minScale = shortestDeviceDim / (mapDim || 2000);
            if (scale < minScale) scale = minScale;
            keepInBounds();
        }
        redraw();
    }

    function keepInBounds() {
        const w = activeImage.width * scale;
        const h = activeImage.height * scale;

        if (w > canvas.width) offsetX = Math.min(0, Math.max(canvas.width - w, offsetX));
        else offsetX = (canvas.width - w) / 2;

        if (h > canvas.height) offsetY = Math.min(0, Math.max(canvas.height - h, offsetY));
        else offsetY = (canvas.height - h) / 2;
    }

    function redraw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        if (!activeImage.complete || activeImage.naturalWidth === 0) {
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#ef4444';
            ctx.font = '18px Arial';
            ctx.textAlign = 'center';
            const formattedId = currentRegion.id.toString().padStart(2, '0');
            ctx.fillText(`Missing File: region${formattedId}${currentLayer}.png`, canvas.width/2, canvas.height/2);
            return;
        }

        ctx.save();
        ctx.translate(offsetX, offsetY);
        ctx.scale(scale, scale);
        
        // Draw Base Map Image
        ctx.drawImage(activeImage, 0, 0);
        ctx.restore(); 
        
        // --- DRAW LANDMARKS (Screen Space to keep consistent size) ---
        // Added filter logic here
        const visibleLandmarks = landmarks.filter(lm => 
            lm.region === currentRegion.id && 
            lm.level.toLowerCase() === currentLayer &&
            activeFilters.includes(lm.type) 
        );
        
        for (let lm of visibleLandmarks) {
            const lmImgX = (lm.x - currentRegion.gameStartX) * 1.5;
            const lmImgY = (currentRegion.gameStartY - lm.y) * 1.5;
            
            const screenX = (lmImgX * scale) + offsetX;
            const screenY = (lmImgY * scale) + offsetY;
            
            const icon = icons[lm.type];
            
            if (icon && icon.complete && icon.naturalWidth !== 0) {
                // Determine scale factor to fit inside a 30x30 bounding box
                const maxDim = Math.max(icon.naturalWidth, icon.naturalHeight);
                const scaleFactor = 30 / maxDim;
                
                const drawW = icon.naturalWidth * scaleFactor;
                const drawH = icon.naturalHeight * scaleFactor;
                
                // Draw centered on the screen coordinate
                ctx.drawImage(icon, screenX - (drawW / 2), screenY - (drawH / 2), drawW, drawH);
            } else {
                // Fallback blue dot if the specific icon image fails to load
                ctx.beginPath();
                ctx.arc(screenX, screenY, 15, 0, 2*Math.PI);
                ctx.fillStyle = '#3b82f6';
                ctx.fill();
            }
        }

        // --- DRAW UI OVERLAYS (Landmark Tooltip or Custom Ping) ---
        if (selectedLandmark) {
            const lmImgX = (selectedLandmark.x - currentRegion.gameStartX) * 1.5;
            const lmImgY = (currentRegion.gameStartY - selectedLandmark.y) * 1.5;
            
            const screenX = (lmImgX * scale) + offsetX;
            const screenY = (lmImgY * scale) + offsetY;

            // Highlight ring around selected landmark (consistent size)
            ctx.beginPath();
            ctx.arc(screenX, screenY, 25, 0, 2 * Math.PI);
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#facc15'; // Gold highlight
            ctx.stroke();

            coordLabel.style.left = `${screenX + 25}px`;
            coordLabel.style.top = `${screenY - 20}px`;
            coordLabel.style.borderColor = '#facc15';
            
            let detailHtml = selectedLandmark.details ? `<span class="img-coords" style="margin-top:6px;">${selectedLandmark.details}</span>` : '';
            
            coordLabel.innerHTML = `
                <span class="landmark-title">${selectedLandmark.name}</span>
                <span style="color:#e2e8f0; font-weight:bold;">${selectedLandmark.type}</span>
				<span class="game-coords">(${formatCoord(selectedLandmark.x)}, ${formatCoord(selectedLandmark.y)}, ${formatCoord(selectedLandmark.z)})</span>
                ${detailHtml}
            `;
            coordLabel.style.display = 'block';

        } else if (markerX !== null && markerY !== null) {
            // Standard Custom Ping
            const screenX = (markerX * scale) + offsetX;
            const screenY = (markerY * scale) + offsetY;

            ctx.beginPath();
            ctx.arc(screenX, screenY, 12, 0, 2 * Math.PI);
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#4ade80';
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(screenX, screenY, 3, 0, 2 * Math.PI);
            ctx.fillStyle = '#4ade80';
            ctx.fill();

            const conversionFactor = 2 / 3;
            const gameX = currentRegion.gameStartX + (markerX * conversionFactor);
            const gameY = currentRegion.gameStartY - (markerY * conversionFactor);

            coordLabel.style.left = `${screenX + 18}px`;
            coordLabel.style.top = `${screenY - 15}px`;
            coordLabel.style.borderColor = '#4ade80';
            
            coordLabel.innerHTML = `
				<span class="game-coords">Game: (${formatCoord(gameX)}, ${formatCoord(gameY)})</span>
                <span class="img-coords">Image PX: (${Math.round(markerX)}, ${Math.round(markerY)})</span>
            `;
            coordLabel.style.display = 'block';
        } else {
            coordLabel.style.display = 'none';
        }
    }

    function zoomAround(zoomFactor, centerX, centerY) {
        const oldScale = scale;
        scale = Math.min(maxScale, Math.max(minScale, scale * zoomFactor));
        const actualFactor = scale / oldScale;
        offsetX = centerX - (centerX - offsetX) * actualFactor;
        offsetY = centerY - (centerY - offsetY) * actualFactor;
        keepInBounds();
        redraw();
    }

    window.addEventListener('wheel', (e) => {
        if (!currentRegion) return;
        e.preventDefault();
        zoomAround(e.deltaY < 0 ? 1.15 : 0.85, e.clientX, e.clientY);
    }, { passive: false });

    window.addEventListener('pointerdown', (e) => {
        if (!currentRegion || e.clientY < 70) return; 
        isDragging = true;
        dragMoveCounter = 0; 
        startX = e.clientX - offsetX;
        startY = e.clientY - offsetY;
    });

    window.addEventListener('pointermove', (e) => {
        if (!isDragging || (e.pointerType === 'touch' && e.buttons === 0)) return;
        dragMoveCounter++; 
        offsetX = e.clientX - startX;
        offsetY = e.clientY - startY;
        keepInBounds();
        redraw();
    });

    window.addEventListener('pointerup', (e) => {
        if (!isDragging) return;
        isDragging = false;

        if (e.target.closest('.ui-panel') || e.target.closest('.btn') || e.target.closest('.layer-btn')) {
            return;
        }

        if (dragMoveCounter < 5) {
            let clickedLandmark = null;
            const clickTolerance = 15; // Radius in screen pixels (matching the 30x30 icon)

            // Check if we clicked on any visible landmark using Screen Coordinates            
            const visibleLandmarks = landmarks.filter(lm => 
                lm.region === currentRegion.id && 
                lm.level.toLowerCase() === currentLayer &&
                activeFilters.includes(lm.type)
            );

            for (let lm of visibleLandmarks) {
                const lmImgX = (lm.x - currentRegion.gameStartX) * 1.5;
                const lmImgY = (currentRegion.gameStartY - lm.y) * 1.5;
                
                const screenX = (lmImgX * scale) + offsetX;
                const screenY = (lmImgY * scale) + offsetY;
                
                const dist = Math.hypot(e.clientX - screenX, e.clientY - screenY);
                if (dist <= clickTolerance) {
                    clickedLandmark = lm;
                    break;
                }
            }

            if (clickedLandmark) {
                selectedLandmark = clickedLandmark;
                markerX = null; 
                markerY = null;
            } else {
                // Determine raw image coordinates for standard map pings
                const clickedImageX = (e.clientX - offsetX) / scale;
                const clickedImageY = (e.clientY - offsetY) / scale;
                
                if (clickedImageX >= 0 && clickedImageX <= activeImage.width && clickedImageY >= 0 && clickedImageY <= activeImage.height) {
                    selectedLandmark = null;
                    markerX = clickedImageX;
                    markerY = clickedImageY;
                }
            }
            redraw();
        }
    });

    window.addEventListener('touchstart', (e) => {
        if (!currentRegion) return;
        if (e.touches.length === 2) {
            isDragging = false;
            initialPinchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
            initialScale = scale;
        }
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
        if (!currentRegion) return;
        if (e.touches.length === 2) {
            e.preventDefault();
            const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
            const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
            const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
            zoomAround((initialScale * (dist / initialPinchDist)) / scale, midX, midY);
        }
    }, { passive: false });

    window.addEventListener('resize', () => resizeCanvas(false));
</script>
</body>
</html>
