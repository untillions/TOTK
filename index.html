<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <title>TOTK Companion</title>
    
    <link rel="apple-touch-icon" href="icons/main-icon.png">
	<link rel="icon" type="image/png" href="icons/main-icon.png">
	
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100dvh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0f19;
            color: #e2e8f0;
            overflow: hidden;
        }

        /* --- DASHBOARD VIEW --- */
        .fade-in { animation: fadeIn ease 8s; }
		@keyframes fadeIn { 0% { opacity:0; } 100% { opacity:1; } }

		body:not(.video-loaded) #dashboard * {
			animation-play-state: paused !important;
		}
		
		body:not(.video-loaded) #bgVideo {
			opacity: 0;
		}

        #bgVideo {
			position: fixed;
			top: 0; left: 0; right: 0; bottom: 0;
			width: 100vw;
			height: 100dvh; /* Changed from vh */
			object-fit: cover;
			object-position: 0% 50%;
			z-index: 1;
		}

        #dashboard {
            width: 100%;
            height: 100%;
            overflow-y: auto;
            box-sizing: border-box;
            padding: 20px;
            padding-top: calc(20px + env(safe-area-inset-top));
            display: flex;
            flex-direction: column;
            align-items: center;
            background: transparent;
        }
        .subtitle {
            margin-bottom: 30px;
            text-align: center;
            z-index: 2;
        }
        .dashboard-btn-wrapper {
			width: 60%;
			max-width: 640px;
			margin: 12vh auto 0px auto;
			display: flex;
			justify-content: flex-end;
			z-index: 2;
		}
		.dashboard-btn-group {
			display: flex;
			flex-direction: column;
			gap: 12px;
			width: max-content;
			z-index: 2;
		}
		#dashboard .layer-btn {
			display: flex;
			align-items: center;
			justify-content: flex-start;
			width: 100%;
			padding: 5px 10px 5px 10px;
			box-sizing: border-box;
			text-align: left;
		}
		#dashboard .layer-btn img {
			width: 30px;
			height: 30px;
			margin-right: 5px;
			flex-shrink: 0;
		}
		#dashboard .layer-btn span {
			line-height: 1.2;
			display: inline-block;
		}
		.dashboard-footer {
			position: absolute;
			bottom: 25px;
			transform: translateX(-50%);
			font-size: 0.9rem;
			color: #FAF7DF;
			text-align: center;
			white-space: nowrap;
			text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
			z-index: 2;
		}
		
		.dashboard-footer a {
			color: #4ade80;
			text-decoration: none;
			transition: color 0.15s ease;
		}
		
		.dashboard-footer a:hover {
			color: #ABB0B8;
			text-decoration: underline;
		}
        
        /* --- CINEMATIC DASHBOARD --- */
		.hero-container {
			position: relative;
			width: 100%;
			max-width: 800px;
			height: 260px; /* Comfortably holds the 200px asset + title buffer */
			margin-top: 1vh;
			z-index: 2;
			display: flex;
			flex-direction: column;
		}
		
		/* The Animated Center Line */
		.hero-line {
			position: absolute;
			top: 80%;
			left: 5%;
			width: 90%;
			height: 2px;
			background-color: #FAF7DF;
			box-shadow: 0 0 10px rgba(74, 222, 128, 0.5); /* Subtle green Hylian glow */
			transform: scaleX(0);
			transform-origin: center;
			animation: stretchLine 1s cubic-bezier(0.4, 0, 0.2, 1) forwards;
			z-index: 4;
		}
		
		/* Container limits for masking the reveals */
		.hero-top, .hero-bottom {
			position: relative;
			width: 100%;
			overflow: hidden;
			opacity: 0;
			animation: waitForLine 0.1s linear 1s forwards;
		}
		.hero-top {
			height: 80%;
			padding-bottom: 5px;
		}
		.hero-bottom {
			height: 20%;
			padding-top: 5px;
		}
		
		/* Left-justified Logo Container */
		.hero-top {
			display: flex;
			align-items: flex-end;
			justify-content: flex-start;
			padding-left: 5%;
			box-sizing: border-box;
		}
		
		.hero-logo {
			max-height: 200px;
			width: auto;
			transform: translateY(100%); /* Start hidden under the center line */
			animation: revealUp 1.2s cubic-bezier(0.4, 0, 0.2, 1) 0.8s forwards;
		}
		
		/* Right-justified Title Container */
		.hero-bottom {
			display: flex;
			align-items: flex-start;
			justify-content: flex-end;
			padding-right: 5%;
			box-sizing: border-box;
		}
		
		.hero-title {
			font-family: 'HyliaSerif', serif;
			color: #FAF7DF;
			text-shadow: 2px 2px 2px black;
			margin: 0;
			font-size: 2rem;
			letter-spacing: 2px;
			transform: translateY(-100%);
			animation: revealDown 1.2s cubic-bezier(0.4, 0, 0.2, 1) 0.8s forwards;
		}
		
		/* --- STAGGERED FADE IN FOR LOWER UI --- */
		.staggered-item {
			opacity: 0;
			animation: dashboardFadeIn 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
			animation-delay: calc(1.8s + (var(--delay) * 0.25s));
			z-index: 2;
		}
		
		.subtitle.staggered-item {
			margin-top: 20px;
			margin-bottom: 30px;
			text-shadow: 0px 0px 3px rgb(30,30,30);
		}
		
		/* --- ANIMATION KEYFRAMES --- */
		@keyframes stretchLine {
			0% { transform: scaleX(0); opacity: 0; }
			5% { opacity: 1; }
			100% { transform: scaleX(1); opacity: 1; }
		}
		
		@keyframes revealUp {
			0% { transform: translateY(100%); }
			100% { transform: translateY(0%); }
		}
		
		@keyframes revealDown {
			0% { transform: translateY(-100%); }
			100% { transform: translateY(0%); }
		}
		
		@keyframes dashboardFadeIn {
			0% { opacity: 0; transform: translateY(10px); }
			100% { opacity: 1; transform: translateY(0); }
		}
		
		@keyframes waitForLine {
			0% { opacity: 0; }
			100% { opacity: 1; }
		}

        /* --- MAP VIEWER VIEW --- */
        #mapViewer {
			display: none;
			position: relative;
			width: 100vw;
			height: 100dvh;
		}
		canvas {
			display: block;
			position: absolute;
			top: 0; left: 0;
			width: 100vw;
			height: 100dvh;
			cursor: grab;
		}
        canvas:active { cursor: grabbing; }

        /* --- BOTTOM PANEL --- */
        #bottomLeftPanel {
			position: fixed;
			bottom: calc(25px + env(safe-area-inset-bottom));
			left: calc(15px + env(safe-area-inset-left));
			z-index: 10;
		}
		
		#bottomRightPanel {
			position: fixed;
			bottom: calc(25px + env(safe-area-inset-bottom));
			right: calc(15px + env(safe-area-inset-right));
			z-index: 10;
		}
		
		#regionTitlePanel {
			position: fixed;
			bottom: calc(25px + env(safe-area-inset-bottom));
			left: 50%;
			transform: translateX(-50%);
			z-index: 10;
			cursor: pointer;
			padding: 5px 15px;
			max-width: calc(100vw - 130px); 
			box-sizing: border-box;
		}
        #regionTitle {
			font-family: 'HyliaSerif', serif;
            margin: 0;
            text-align: center;
            font-size: 1rem;
            color: #4ade80;
        }
        #regionMenu {
			display: none;
			position: absolute;
			bottom: 60px;
			left: 50%;
			transform: translateX(-50%);
			background: rgba(15, 23, 42, 0.95);
			border: 1px solid #334155;
			border-radius: 8px;
			padding: 10px;
			box-shadow: 0 -4px 20px rgba(0,0,0,0.5);
			flex-direction: column;
			gap: 5px;
			max-height: 350px;
			overflow-y: auto;
			z-index: 10;
			width: max-content;
		}
		.region-menu-btn {
			background: transparent;
			border: none;
			color: #94a3b8;
			padding: 8px 15px;
			cursor: pointer;
			font-family: 'HyliaSerif', serif;
			font-size: 1rem;
			text-align: center;
			border-radius: 4px;
		}
		.region-menu-btn:hover {
			background: #75b38c;
			color: #0f172a;
		}
		.region-menu-btn.active {
			color: #4ade80;
		}
        
        .btn {
            background: #1e293b;
            border: 1px solid #475569;
            color: white;
            padding: 2px 5px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
        .btn:hover { background: #475569; }

        .layer-btn {
            background: rgba(30, 41, 59, 0.85); /* Slightly transparent like the glass menus */
            backdrop-filter: blur(8px);
            border: 1px solid #475569;
            color: #94a3b8;
            padding: 5px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.15s ease;
            display: flex;
            align-items: center; 
            justify-content: center;
            gap: 8px;
            z-index: 1;
        }
        .layer-btn img {
            display: block;
        }
        .layer-btn.active {
            background: #75b38c;
            color: #0f172a;
            border-color: #4ade80;
        }
        .active-panel {
			outline: 1px solid #4ade80 !important;
			outline-offset: -1px;
			border-radius: 6px; /* Matches your general UI rounding */
		}
        
        /* Coordinate/Landmark tooltip label overlay */
		#coordLabel {
			position: absolute;
			z-index: 12;
			background: rgba(15, 23, 42, 0.95);
			border: 1px solid #4ade80;
			color: #e2e8f0;
			padding: 8px 14px;
			border-radius: 6px;
			font-family: monospace;
			font-size: 0.85rem;
			line-height: 1.4;
			pointer-events: none; 
			display: none; 
			max-width: 220px;
			box-shadow: 0 4px 16px rgba(0,0,0,0.6);
		}
		.game-coords {
			color: #ffffff;
			font-weight: bold;
			display: block;
			margin-bottom: 4px;
		}
		.img-coords {
			color: #94a3b8;
			font-size: 0.75rem;
			display: block;
		}
        .landmark-title {
            font-family: 'HyliaSerif', serif;
            font-weight: normal;
            font-size: 1.1rem;
            display: block;
            margin-bottom: 2px;
            letter-spacing: 1px;
        }
        
        /* --- LOADER --- */
        #loader {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #0b0f19;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 30;
            gap: 15px;
        }
        .spinner {
            width: 80px; height: 80px;
            animation: spin 2s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* --- REUSABLE TEXT ANIMATION --- */
        .text-anim-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-size: 1rem;
            font-weight: bold;
        }
        #staticAnimText {
            color: #FAF7DF;
            width: auto;
            text-shadow: 1px 1px 3px black;
            text-align: right;
        }
        #staticAnimText2 {
            color: #FAF7DF;
            width: 150px;
            text-align: right;
        }
        .dynamic-container {
            position: relative;
            height: 50px; 
            width: 150px; 
            overflow: hidden; 
            text-align: left;
        }
        .cycle-slide {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            font-style: normal; /* Overrides the italic from the dashboard */
        }
        .cycle-slide img {
            height: 30px;
            width: auto;
            display: block;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6));
        }
              

        /* --- TOGGLE SLIDERS --- */
        .switch {
            position: relative;
            display: inline-block;
            width: 30px;
            height: 16px;
            margin-left: auto;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #334155;
            transition: 0.3s;
            border-radius: 20px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 12px; 
            width: 12px;
            left: 2px; bottom: 2px;
            background-color: white;
            transition: 0.3s;
            border-radius: 50%;
        }
        input:checked + .slider { background-color: #4ade80; }
        input:checked + .slider:before { transform: translateX(14px); }

        /* --- SLIDE-UP ANIMATIONS --- */
        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animated-item {
            opacity: 0;
            animation: slideUpFade 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
        /* --- LAYER MENU --- */
        #layerPanel {
            position: absolute;
            top: calc(15px + env(safe-area-inset-top));
            left: 15px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            z-index: 10;
            box-shadow: none; /* Removed from panel, applied to menu */
        }
        #layerMenu {
            display: none;
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 10px;
            margin-top: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            flex-direction: column;
            gap: 8px;
        }
        /* --- FILTER MENU --- */
        #filterPanel {
            position: absolute;
			top: calc(15px + env(safe-area-inset-top));
            right: 15px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            z-index: 10;
        }
        #filterMenu {
            display: none;
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 12px;
            margin-top: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            flex-direction: column;
            gap: 6px;
            min-width: 220px; 
			max-height: calc(100vh - 180px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
            overflow-y: auto;
        }
        .filter-label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            color: #e2e8f0;
            font-weight: 600;
            width: 100%;
        }
        .filter-label input {
            cursor: pointer;
            width: 16px;
            height: 16px;
            accent-color: #4ade80;
        }
        .filter-icon {
            width: 22px;
            height: 22px;
            display: block;
        }
        /* --- MASTER FILTER CONTROLS --- */
        .filter-master-row {
            display: flex;
            justify-content: space-between;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 4px;
            font-size: 0.8rem;
            font-weight: bold;
            user-select: none;
        }
        .filter-master-btn {
            cursor: pointer;
            transition: opacity 0.15s ease;
        }
        .filter-master-btn:hover {
            opacity: 0.8;
        }
        .filter-master-btn.show-all {
            color: #4ade80;
        }
        .filter-master-btn.hide-all {
            color: #94a3b8;
        }
        
        /* --- FILTER CATEGORY HIERARCHY --- */
        .filter-category {
            margin-bottom: 6px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 6px;
        }
        .filter-category:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }
        .filter-category-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #94a3b8;
            font-weight: bold;
            text-transform: uppercase;
            padding: 4px 0;
            user-select: none;
        }
        .filter-category-title {
            display: flex;
            align-items: center;
            gap: 5px;
            flex-grow: 1;
            cursor: pointer;
        }
        .category-chevron {
            font-size: 0.7rem;
            transition: transform 0.2s ease;
        }
        .category-collapsed .category-chevron {
            transform: rotate(-90deg);
        }
        .filter-category-content {
            display: flex;
            flex-direction: column;
            gap: 8px; /* Spacing between items inside a category */
            padding-top: 8px;
            padding-left: 5px; 
            overflow: hidden;
        }
        .category-collapsed .filter-category-content {
            display: none;
        }
        
        /* --- SEARCH & REGION MENUS --- */
		#searchPanel {
			position: absolute;
			top: calc(18px + env(safe-area-inset-top));
			left: 50%;
			transform: translateX(-50%);
			z-index: 20;
			display: flex;
			flex-direction: column;
			width: 350px;
			max-width: calc(100vw - 150px); 
		}
		#searchInput {
			background: rgba(30, 41, 59, 0.85);
			backdrop-filter: blur(8px);
			border: 1px solid #475569;
			color: #e2e8f0;
			padding: 8px 12px;
			border-radius: 6px;
			font-size: 1rem;
			outline: none;
			width: 100%;
			box-sizing: border-box;
			font-family: 'Segoe UI', sans-serif;
		}
		#searchInput:focus {
			border-color: #4ade80;
		}
		#autocompleteResults {
			display: none;
			background: rgba(15, 23, 42, 0.95);
			border: 1px solid #334155;
			border-radius: 6px;
			margin-top: 5px;
			max-height: 250px;
			overflow-y: auto;
			box-shadow: 0 4px 16px rgba(0,0,0,0.6);
		}
		.autocomplete-item {
			padding: 10px 12px;
			cursor: pointer;
			display: flex;
			align-items: center;
			gap: 10px;
			border-bottom: 1px solid rgba(255,255,255,0.05);
		}
		.autocomplete-item:hover {
			background: rgba(74, 222, 128, 0.1);
		}
		.autocomplete-item:last-child {
			border-bottom: none;
		}
        
        /* --- FONTS --- */
        @font-face {
            font-family: 'HyliaSerif';
            src: url('fonts/HyliaSerif.otf') format('truetype'); /* Adjust extension if needed */
            font-weight: normal;
            font-style: normal;
        }
		
		.tooltip-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 4px;
        }
		/* --- DIGITAL --- */
		
		@media (max-width: 600px) {
			
			.hero-container {
				height: 185px;
				margin-bottom: 20px;
			}
			.hero-logo {
				max-height: 150px;
			}
			.hero-title {
				font-size: 1.5rem;
				text-shadow: 1px 1px 1px black;
			}
			.dashboard-btn-wrapper {
				width: 100%;
				max-width: none;
				margin: 15vh 0 0 0;
			}
			.dashboard-btn-group {
				margin-left: auto;
				margin-right: 5%;
			}
			.dashboard-footer {
				white-space: normal;
				width: 90%;
				line-height: 1.4;
			}

		}
                
    </style>
</head>
<body>

	<div id="dashboard">
		<video autoplay muted loop playsinline poster="videos/fallback.png" id="bgVideo" class="fade-in">
			<source src="videos/bg-desktop.mp4" media="(min-width: 768px)">
			<source src="videos/bg-mobile.mp4" media="(max-width: 767px)">
		</video>
	
		<div class="hero-container">
			<div class="hero-line"></div>
			
			<div class="hero-top">
				<img src="icons/totk.png" alt="TOTK Logo" class="hero-logo">
			</div>
			
			<div class="hero-bottom">
				<h1 class="hero-title">Region Companion</h1>
			</div>
		</div>
	
		<div class="subtitle staggered-item text-anim-wrapper" style="--delay: 1">
			<span id="staticAnimText">DISCOVER EVERY</span>
			<div id="dashboardDynamicContainer" class="dynamic-container"></div>
		</div>
		
		<div class="dashboard-btn-wrapper">
			<div class="dashboard-btn-group">
				<button class="layer-btn staggered-item" style="--delay: 2;" onclick="loadRegion(REGIONS[0])">
					<img src="icons/map.png"> <span>View<br>Map</span>
				</button>
				<button class="layer-btn staggered-item" style="--delay: 3;" onclick="">
					<img src="icons/list.png"> <span>View<br>List</span>
				</button>
				<button class="layer-btn staggered-item" style="--delay: 4;" onclick="">
					<img src="icons/progress2.png"> <span>View<br>Progress</span>
				</button>
			</div>
		</div>
		<div class="dashboard-footer staggered-item" style="--delay: 5;">
			Icons by <em>NOT ME</em> on <a href="https://www.flaticon.com/authors/freepik" title="Flaticon">Flaticon</a><br>
			Hylia Serif Font from <a href="https://www.fontbolt.com/font/zelda-font/" title="Font Bolt">Font Bolt</a>
		</div>
	</div>
	
	<div id="mapViewer">
		<canvas id="mapCanvas"></canvas>
		<div id="coordLabel"></div>
		<div id="loader">

    // --- FILTERING STATE ---

    const cycleLandmarks = Object.keys(loaderPlurals);

    function startCycleAnimation(containerId, usePlural = false) {
        const container = document.getElementById(containerId);
        if (!container) return;
        
        container.innerHTML = '';

        // Pass the flag down to the item creator
        let currentCycleItem = createCycleItem(usePlural);
        currentCycleItem.style.transform = 'translate(0%, 0%)';
        container.appendChild(currentCycleItem);

        return setInterval(() => {
            // Pass the flag here as well
            const nextItem = createCycleItem(usePlural);
            
            const dir = Math.floor(Math.random() * 4);
            let startX = 0, startY = 0, endX = 0, endY = 0;

            if (dir === 0) { startY = -100; endY = 100; }      
            else if (dir === 1) { startX = 100; endX = -100; } 
            else if (dir === 2) { startY = 100; endY = -100; } 
            else if (dir === 3) { startX = -100; endX = 100; } 

            nextItem.style.transform = `translate(${startX}%, ${startY}%)`;
            container.appendChild(nextItem);
            void nextItem.offsetWidth;
            nextItem.style.transform = 'translate(0%, 0%)';
            
            if (currentCycleItem) {
                currentCycleItem.style.transform = `translate(${endX}%, ${endY}%)`;
                const itemToRemove = currentCycleItem;
                setTimeout(() => {
                    if (itemToRemove && itemToRemove.parentNode) {
                        itemToRemove.parentNode.removeChild(itemToRemove);
                    }
                }, 600); 
            }
            currentCycleItem = nextItem;
        }, 2000); 
    }

    function createCycleItem(usePlural) {
    	let type = null;
		do {
            type = cycleLandmarks[Math.floor(Math.random() * cycleLandmarks.length)];
        } while (type === lastLandmarkType && cycleLandmarks.length > 1);

        // Update the tracker
        lastLandmarkType = type;
        // const type = cycleLandmarks[Math.floor(Math.random() * cycleLandmarks.length)];
        const color = landmarkColors[type] || landmarkColors["default"];
        
        const displayName = usePlural ? loaderPlurals[type] : type;
        
        const fileName = type.toLowerCase().replace(/\s+/g, '-');
        const formattedName = displayName.replace(' ', '<br>');

        const div = document.createElement('div');
        div.className = 'cycle-slide';
        div.innerHTML = `
            <img src="icons/${fileName}.png">
            <span style="color: ${color}; font-family: 'HyliaSerif', serif; letter-spacing: 1px; line-height: 1.1;">${formattedName}</span>
        `;
        return div;
    }
    
    let activeFiltersByLayer = {
        surface: [...FILTER_CONFIG.surface.defaults],
        sky: [...FILTER_CONFIG.sky.defaults],

    function toggleFilterMenu() {
		const menu = document.getElementById('filterMenu');

		const isOpening = menu.style.display !== 'flex';

		document.getElementById('autocompleteResults').style.display = 'none';

			menu.style.display = 'flex';
			btn.classList.add('active-panel');

	}

		const btn = document.getElementById('layerBtn');
		const isOpening = menu.style.display !== 'flex';
		
		document.getElementById('filterMenu').style.display = 'none';
		document.getElementById('regionMenu').style.display = 'none';

			menu.style.display = 'flex';

		document.getElementById('filterMenu').style.display = 'none';
		document.getElementById('autocompleteResults').style.display = 'none';

	function clearActivePanels() {
		document.getElementById('layerBtn').classList.remove('active-panel');
		document.getElementById('filterBtn').classList.remove('active-panel');
		document.getElementById('regionTitlePanel').classList.remove('active-panel');

    function buildFilterMenu() {
        const menu = document.getElementById('filterMenu');
        menu.innerHTML = '';
        const config = FILTER_CONFIG[currentLayer];
        let layerFilters = activeFiltersByLayer[currentLayer]; 
        
        // --- 1. Master Show All / Hide All Row ---
        const masterRow = document.createElement('div');
        masterRow.className = 'filter-master-row';

        const showAllBtn = document.createElement('span');
        showAllBtn.className = 'filter-master-btn show-all';
        showAllBtn.innerText = 'SHOW ALL';
        showAllBtn.onclick = () => {
            activeFiltersByLayer[currentLayer] = Object.keys(config.options);
            menu.querySelectorAll('.switch input').forEach(cb => cb.checked = true);
            redraw();
        };

        const hideAllBtn = document.createElement('span');
        hideAllBtn.className = 'filter-master-btn hide-all';
        hideAllBtn.innerText = 'HIDE ALL';
        hideAllBtn.onclick = () => {
            activeFiltersByLayer[currentLayer] = [];
            menu.querySelectorAll('.switch input').forEach(cb => cb.checked = false);
            redraw();
        };

        masterRow.appendChild(showAllBtn);
        masterRow.appendChild(hideAllBtn);
        menu.appendChild(masterRow);

        // --- 2. Build Category Hierarchies ---
        FILTER_CATEGORIES.forEach(category => {
            // Find items in this category that are available on the current layer
            const availableItems = category.items.filter(item => config.options[item]);

            if (availableItems.length === 0) return; // Skip if layer has none of these

            const catDiv = document.createElement('div');
            catDiv.className = 'filter-category'; // Expand by default

            // Header (Title, Chevron, and Category Master Toggle)
            const headerDiv = document.createElement('div');
            headerDiv.className = 'filter-category-header';

            const titleSpan = document.createElement('div');
            titleSpan.className = 'filter-category-title';
            titleSpan.innerHTML = `<span class="category-chevron">▼</span> ${category.name}`;
            titleSpan.onclick = () => {
                catDiv.classList.toggle('category-collapsed');
            };

            const switchDiv = document.createElement('label');
            switchDiv.className = 'switch';
            
            const categoryCb = document.createElement('input');
            categoryCb.type = 'checkbox';
            // It is checked only if ALL available items in this category are active
            categoryCb.checked = availableItems.every(item => layerFilters.includes(item));
            
            categoryCb.onchange = (e) => {
                const isChecked = e.target.checked;
                availableItems.forEach(item => {
                    if (isChecked) {
                        if (!activeFiltersByLayer[currentLayer].includes(item)) {
                            activeFiltersByLayer[currentLayer].push(item);
                        }
                    } else {
                        activeFiltersByLayer[currentLayer] = activeFiltersByLayer[currentLayer].filter(f => f !== item);
                    }
                });
                
                // Visually update all child checkboxes in this category
                const childBoxes = catDiv.querySelectorAll('.filter-category-content input[type="checkbox"]');
                childBoxes.forEach(box => box.checked = isChecked);
                
                redraw();
            };
            
            const sliderSpan = document.createElement('span');
            sliderSpan.className = 'slider';
            switchDiv.appendChild(categoryCb);
            switchDiv.appendChild(sliderSpan);

            headerDiv.appendChild(titleSpan);
            headerDiv.appendChild(switchDiv);
            catDiv.appendChild(headerDiv);

            // Item List Container
            const contentDiv = document.createElement('div');
            contentDiv.className = 'filter-category-content';

            availableItems.forEach((type, index) => {
                const labelText = config.options[type];
                const label = document.createElement('label');
                label.className = 'filter-label animated-item';
                label.style.animationDelay = `${index * 0.03}s`; // Sped up the stagger slightly
                
                const iconImg = document.createElement('img');
                const fileName = type.toLowerCase().replace(/\s+/g, '-');
                iconImg.src = `icons/${fileName}.png`;
                iconImg.className = 'filter-icon';
                
                const itemSwitch = document.createElement('div');
                itemSwitch.className = 'switch';
                
                const itemCb = document.createElement('input');
                itemCb.type = 'checkbox';
                itemCb.value = type;
                itemCb.checked = layerFilters.includes(type);
                
                itemCb.onchange = (e) => {
                    if (e.target.checked) {
                        if (!activeFiltersByLayer[currentLayer].includes(type)) {
                            activeFiltersByLayer[currentLayer].push(type);
                        }
                    } else {
                        activeFiltersByLayer[currentLayer] = activeFiltersByLayer[currentLayer].filter(f => f !== type);
                    }
                    
                    // Update category master toggle state based on children
                    const allChecked = availableItems.every(i => activeFiltersByLayer[currentLayer].includes(i));
                    categoryCb.checked = allChecked;
                    
                    redraw();
                };
                
                const itemSlider = document.createElement('span');
                itemSlider.className = 'slider';
                
                itemSwitch.appendChild(itemCb);
                itemSwitch.appendChild(itemSlider);
                
                label.appendChild(iconImg);
                label.appendChild(document.createTextNode(labelText));
                label.appendChild(itemSwitch);
                
                contentDiv.appendChild(label);
            });

            catDiv.appendChild(contentDiv);
            menu.appendChild(catDiv);
        });
    }

    function formatCoord(val) {
        const sign = val < 0 ? '-' : '';
        return sign + Math.abs(Math.round(val)).toString().padStart(4, '0');
    }
    
    function executeArrowNavigation(arr) {

    function setLayer(layer) {
        if (currentLayer === layer) {
            document.getElementById('layerMenu').style.display = 'none';
            return;
        }
        currentLayer = layer;
        
        // Update the main layer button image to reflect current state
        document.getElementById('currentLayerIcon').src = `icons/${layer}.png`;
        
        markerX = null;
        markerY = null;
        selectedLandmark = null;
        coordLabel.style.display = 'none';
        
        updateLayerUI();
        updateMapAsset();
        
        document.getElementById('filterMenu').style.display = 'none';
        document.getElementById('layerMenu').style.display = 'none';
        buildFilterMenu();

    function updateLayerUI() {
		document.querySelectorAll('#layerMenu .layer-btn').forEach(btn => {
			btn.classList.remove('active');
			if(btn.innerText.toLowerCase().includes(currentLayer)) {
				btn.classList.add('active');
			}
		});
	}

    function updateMapAsset() {
        document.getElementById('loader').style.display = 'flex';
        loaderInterval = startCycleAnimation('loaderDynamicContainer', true);
 
        const formattedId = currentRegion.id.toString().padStart(2, '0');
        const srcPath = `images/region${formattedId}${currentLayer}.png`;
        activeImage = new Image();
        activeImage.onload = () => {
            document.getElementById('loader').style.display = 'none'; 
            clearInterval(loaderInterval);
            
            if (scale === -1) {
                resizeCanvas(true); 
            } else {
                redraw();
            }
        };
        activeImage.onerror = () => { 
            document.getElementById('loader').style.display = 'none'; 
            clearInterval(loaderInterval);
            redraw(); 
        };
        
		activeImage.src = srcPath;
    }

    function exitToDashboard() {
        document.getElementById('mapViewer').style.display = 'none';
        document.getElementById('dashboard').style.display = 'flex';
        currentRegion = null;
        coordLabel.style.display = 'none';
        
        if (!dashInterval) dashInterval = startCycleAnimation('dashboardDynamicContainer', false);
    }

    function resizeCanvas(resetZoom = false) {
		if (!currentRegion) return;
	
		const dpr = window.devicePixelRatio || 1;
		
		canvas.width = window.innerWidth * dpr;
		canvas.height = window.innerHeight * dpr;
		
		canvas.style.width = `${window.innerWidth}px`;
		canvas.style.height = `${window.innerHeight}px`;
		
		ctx.setTransform(1, 0, 0, 1, 0, 0); 
		ctx.scale(dpr, dpr);
	
		const scaleX = window.innerWidth / (activeImage.width || 2000);
		const scaleY = window.innerHeight / (activeImage.height || 2000);
		
		const calculatedMinScale = Math.min(scaleX, scaleY);
	
		if (resetZoom) {
			minScale = calculatedMinScale; 
			scale = minScale;
			
			offsetX = (window.innerWidth - (activeImage.width * scale)) / 2;
			offsetY = (window.innerHeight - (activeImage.height * scale)) / 2;
		} else {
			minScale = calculatedMinScale;
			if (scale < minScale) scale = minScale;
			keepInBounds();
		}
		redraw();
	}

	let panAnimId = null;

    function smoothPanTo(targetOffsetX, targetOffsetY) {
        cancelAnimationFrame(panAnimId);
        const startX = offsetX;
        const startY = offsetY;
        const duration = 350; // Milliseconds for the glide
        const startTime = performance.now();

        function step(currentTime) {
            const elapsed = currentTime - startTime;
            const progress = Math.min(elapsed / duration, 1);
            
            // Cubic ease-out formula for a smooth deceleration
            const ease = 1 - Math.pow(1 - progress, 3);

            offsetX = startX + (targetOffsetX - startX) * ease;
            offsetY = startY + (targetOffsetY - startY) * ease;

            keepInBounds();
            redraw();

            if (progress < 1) {
                panAnimId = requestAnimationFrame(step);
            }
        }
        panAnimId = requestAnimationFrame(step);
    }
    
    function keepInBounds() {
		const w = activeImage.width * scale;
		const h = activeImage.height * scale;
	
		if (w > window.innerWidth) offsetX = Math.min(0, Math.max(window.innerWidth - w, offsetX));
		else offsetX = (window.innerWidth - w) / 2;
	
		if (h > window.innerHeight) offsetY = Math.min(0, Math.max(window.innerHeight - h, offsetY));
		else offsetY = (window.innerHeight - h) / 2;
	}
    
    // --- SEARCH & REGION MENU LOGIC ---	
	function buildRegionMenu() {
		const menu = document.getElementById('regionMenu');
		menu.innerHTML = '';
		
		MENU_REGIONS.forEach(menuItem => {
			const masterRegion = REGIONS.find(r => r.id === menuItem.id);
			
			const btn = document.createElement('button');
			btn.className = 'region-menu-btn' + (currentRegion && currentRegion.id === menuItem.id ? ' active' : '');
			btn.innerText = menuItem.name;
			
			btn.onclick = () => {
				toggleRegionMenu();
				loadRegion(masterRegion); 
			};
			
			menu.appendChild(btn);
		});
	}
	
	const searchInput = document.getElementById('searchInput');
	const autocompleteResults = document.getElementById('autocompleteResults');
	
	searchInput.addEventListener('focus', function() {
		document.getElementById('layerMenu').style.display = 'none';
		document.getElementById('filterMenu').style.display = 'none';
		document.getElementById('regionMenu').style.display = 'none';
		clearActivePanels();
		
		if (this.value.trim() !== '') {
			autocompleteResults.style.display = 'block';
		}
	});

	searchInput.addEventListener('input', function() {
		const val = this.value.toLowerCase().trim();
		autocompleteResults.innerHTML = '';
		if (!val) {
			autocompleteResults.style.display = 'none';
			return;
		}
	
		const matches = landmarks.filter(lm => lm.name.toLowerCase().includes(val)).slice(0, 15);
		if (matches.length === 0) {
			autocompleteResults.style.display = 'none';
			return;
		}
	
		matches.forEach(lm => {
			const item = document.createElement('div');
			item.className = 'autocomplete-item';
	
			const lmColor = landmarkColors[lm.landmark] || landmarkColors["default"];
			const fileName = lm.landmark.toLowerCase().replace(/\s+/g, '-');
	
			item.innerHTML = `
				<img src="icons/${fileName}.png" style="height: 2em; width: auto; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.5));">
				<div>
					<span style="font-family: 'HyliaSerif', serif; color: ${lmColor}; font-size: 1.05rem; letter-spacing: 0.5px;">${lm.name}</span>
					<span style="color:#94a3b8; font-weight:bold; font-size: 0.8rem; margin-left: 8px;">${lm.type}</span>
				</div>
			`;
	
			item.onclick = () => {
				searchInput.value = '';
				autocompleteResults.style.display = 'none';
				navigateToLandmark(lm);
			};
	
			autocompleteResults.appendChild(item);
		});
		autocompleteResults.style.display = 'block';
	});
	
	function navigateToLandmark(lm) {
		const regionArray = [].concat(lm.region);
		const targetRegionId = regionArray.includes(0) ? 0 : regionArray[0];
		
		const region = REGIONS.find(r => r.id === targetRegionId);
		if (!region) return;
	
		const needsLoad = (!currentRegion || currentRegion.id !== region.id || currentLayer !== lm.level.toLowerCase());
		
		if (needsLoad) {
			document.getElementById('coordLabel').style.display = 'none';
			
			currentRegion = region;
			currentLayer = lm.level.toLowerCase();
			
			const layerBtn = document.getElementById('layerBtn');
			if (currentRegion.id === 0) {
				layerBtn.style.opacity = '0.5';
				layerBtn.style.pointerEvents = 'none';
			} else {
				layerBtn.style.opacity = '1';
				layerBtn.style.pointerEvents = 'auto';
			}
			
			document.getElementById('regionTitle').innerText = region.name;
			document.getElementById('currentLayerIcon').src = `icons/${currentLayer}.png`;
			updateLayerUI();
			
			document.getElementById('filterMenu').style.display = 'none';
			buildFilterMenu();
			buildRegionMenu();
			
			document.getElementById('dashboard').style.display = 'none';
			document.getElementById('mapViewer').style.display = 'block';
	
			document.getElementById('loader').style.display = 'flex';
			const formattedId = currentRegion.id.toString().padStart(2, '0');
			activeImage = new Image();
			activeImage.src = `images/region${formattedId}${currentLayer}.png`;
			activeImage.onload = () => {
				document.getElementById('loader').style.display = 'none';
				resizeCanvas(true);
				executeZoomAndPan(lm);
			};
			activeImage.onerror = () => { 
				document.getElementById('loader').style.display = 'none'; 
				redraw(); 
			};
		} else {
			executeZoomAndPan(lm);
		}
	}
	
	function executeZoomAndPan(lm) {
		// Ensure the filter is checked so the landmark is visible
		if (!activeFiltersByLayer[currentLayer].includes(lm.landmark)) {
			activeFiltersByLayer[currentLayer].push(lm.landmark);
			const cb = document.querySelector(`#filterMenu input[value="${lm.landmark}"]`);
			if (cb) cb.checked = true;
		}
	
		scale = maxScale * 0.2; // Zoom in
		selectedLandmark = lm;
		markerX = null;
		markerY = null;
		
		const lmImgX = (lm.x - currentRegion.gameStartX) * 1.5;
		const lmImgY = (currentRegion.gameStartY - lm.y) * 1.5;
	
		const tooltipShift = window.innerWidth < 600 ? 120 : 150; 
		
		const targetOffsetX = (window.innerWidth / 2) - tooltipShift - (lmImgX * scale);
		const targetOffsetY = (window.innerHeight / 2) - (lmImgY * scale);
	
		smoothPanTo(targetOffsetX, targetOffsetY);
	}

    function redraw() {
        ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    
		if (!activeImage.complete || activeImage.naturalWidth === 0) {
			ctx.fillStyle = '#1e293b';
			ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
			ctx.fillStyle = '#ef4444';
			ctx.font = '18px Arial';
			ctx.textAlign = 'center';
			const formattedId = currentRegion.id.toString().padStart(2, '0');
			ctx.fillText(`Missing File: region${formattedId}${currentLayer}.png`, window.innerWidth/2, window.innerHeight/2);
			return;
		}

        ctx.save();
        ctx.translate(offsetX, offsetY);
        ctx.scale(scale, scale);
        
        // Draw Base Map Image
        ctx.drawImage(activeImage, 0, 0);
        ctx.restore(); 
        
        // --- DRAW MAP LABELS ---
        const visibleLabels = mapLabels.filter(label => 
            [].concat(label.region).includes(currentRegion.id) && 
            label.level.toLowerCase() === currentLayer
        );
        
        ctx.textAlign = 'center';
        ctx.fillStyle = '#b9a66a'; 
        ctx.strokeStyle = 'rgba(59, 52, 28, 1)';
        
        const minSizeMap = { "S": 10, "M": 12, "L": 14 };
        const maxSizeMap = { "S": 20, "M": 24, "L": 28 };
        
        let zoomFactor = 0;
        if (maxScale > minScale) {
            zoomFactor = (scale - minScale) / (maxScale - minScale);
            zoomFactor = Math.max(0, Math.min(1, zoomFactor));
        }
        
        for (let label of visibleLabels) {
            const sizeKey = label.size?.toUpperCase() || "M";
            
            const minSize = minSizeMap[sizeKey];
            const maxSize = maxSizeMap[sizeKey];
            
            const dynamicFontSize = minSize + (zoomFactor * (maxSize - minSize));
            
            ctx.font = `${dynamicFontSize}px "Segoe UI", sans-serif`; 
            ctx.lineWidth = Math.max(1, dynamicFontSize * 0.25);
            
            const imgX = (label.x - currentRegion.gameStartX) * 1.5;
			const imgY = (currentRegion.gameStartY - label.y) * 1.5;
            const screenX = Math.round((imgX * scale) + offsetX);
			const screenY = Math.round((imgY * scale) + offsetY);
		
			ctx.strokeText(label.text, screenX, screenY);
			ctx.fillText(label.text, screenX, screenY);
        }
        
        ctx.shadowColor = 'transparent';
        
        // --- DRAW LANDMARKS ---
        const visibleLandmarks = landmarks.filter(lm => 
			[].concat(lm.region).includes(currentRegion.id) &&
			lm.level.toLowerCase() === currentLayer &&
			activeFiltersByLayer[currentLayer].includes(lm.landmark) 
		);
        
        for (let lm of visibleLandmarks) {
            const lmImgX = (lm.x - currentRegion.gameStartX) * 1.5;
            const lmImgY = (currentRegion.gameStartY - lm.y) * 1.5;
            
            const screenX = (lmImgX * scale) + offsetX;
            const screenY = (lmImgY * scale) + offsetY;
            
            const icon = icons[lm.landmark];
            
            ctx.shadowColor = 'rgba(0, 0, 0, 1)';
			ctx.shadowBlur = 3;
			ctx.shadowOffsetX = 2;
			ctx.shadowOffsetY = 2;
			
            if (icon && icon.complete && icon.naturalWidth !== 0) {
                // Determine scale factor to fit inside a 30x30 bounding box
                const maxDim = Math.max(icon.naturalWidth, icon.naturalHeight);
                const scaleFactor = 30 / maxDim;
                
                const drawW = icon.naturalWidth * scaleFactor;
                const drawH = icon.naturalHeight * scaleFactor;
                
                // Draw centered on the screen coordinate
                ctx.drawImage(icon, screenX - (drawW / 2), screenY - (drawH / 2), drawW, drawH);
            } else {
                // Fallback blue dot if the specific icon image fails to load
                ctx.beginPath();
                ctx.arc(screenX, screenY, 8, 0, 2*Math.PI);
                ctx.fillStyle = '#3b82f6';
                ctx.fill();
            }
        }
        
        ctx.shadowColor = 'transparent';
        
        // --- DRAW NAV ARROWS ---
		const visibleArrows = navArrows.filter(arr => 
			[].concat(arr.fromRegion).includes(currentRegion.id) && 
			arr.fromLevel.toLowerCase() === currentLayer
		);
		
		ctx.textAlign = 'center';
		ctx.font = 'bold 10px "Segoe UI", sans-serif';
		ctx.fillStyle = '#e2e8f0'; 
		ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
		ctx.shadowBlur = 4;
		ctx.shadowOffsetX = 1;
		ctx.shadowOffsetY = 1;
		
		for (let arr of visibleArrows) {
			const imgX = (arr.x - currentRegion.gameStartX) * 1.5;
			const imgY = (currentRegion.gameStartY - arr.y) * 1.5;
			
			const screenX = (imgX * scale) + offsetX;
			const screenY = (imgY * scale) + offsetY;
		
			if (arrowImg.complete && arrowImg.naturalWidth !== 0) {
				const drawW = 30;
				const drawH = 30;
				
				ctx.save();
				ctx.translate(screenX, screenY);
				ctx.rotate(arr.rotation * Math.PI / 180);
				ctx.drawImage(arrowImg, -(drawW / 2), -(drawH / 2), drawW, drawH);
				ctx.restore();
				
				if (scale > minScale + 0.2) { 
					const lines = arr.label.split('\n');
					const lineHeight = 12; 
					
					lines.forEach((line, index) => {
						ctx.fillText(line, screenX, screenY + 25 + (index * lineHeight));
					});
				}
			}
		}
		ctx.shadowColor = 'transparent';

        // --- DRAW UI OVERLAYS (Landmark Tooltip or Custom Ping) ---
        if (selectedLandmark) {
            const lmImgX = (selectedLandmark.x - currentRegion.gameStartX) * 1.5;
            const lmImgY = (currentRegion.gameStartY - selectedLandmark.y) * 1.5;
            
            const screenX = (lmImgX * scale) + offsetX;
            const screenY = (lmImgY * scale) + offsetY;

            // Get dynamic color
            const lmColor = landmarkColors[selectedLandmark.landmark] || landmarkColors["default"];

            // Highlight ring around selected landmark
            ctx.beginPath();
            ctx.arc(screenX, screenY, 18, 0, 2 * Math.PI);
            ctx.lineWidth = 2;
            ctx.strokeStyle = lmColor; 
            ctx.stroke();

            coordLabel.style.left = `${screenX + 25}px`;
            coordLabel.style.top = `${screenY - 20}px`;
            coordLabel.style.borderColor = lmColor;
                        
            let detailHtml = '';
            if (selectedLandmark.details) {
                if (selectedLandmark.landmark === "Dispenser") {
                    const items = selectedLandmark.details.split(',').map(item => item.trim());
                    
                    const imgTags = items.map(item => {
                        const fileName = item.replace(/\s+/g, '-'); 
                        return `
                            <div style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;" title="${item}">
                                <img src="images/zonai/${fileName}.png" alt="${item}" style="max-width: 100%; max-height: 100%; object-fit: contain;">
                            </div>
                        `;
                    });
                    
                    detailHtml = `<div style="margin-top: 2px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center;">${imgTags.join('')}</div>`;
                } else {
                    detailHtml = `<span class="img-coords" style="margin-top:6px; display:block;">${selectedLandmark.details}</span>`;
                }
            }
            
            // Format the icon filename
            const fileName = selectedLandmark.landmark.toLowerCase().replace(/\s+/g, '-');
            
            coordLabel.innerHTML = `
                <div class="tooltip-header">
                    <img src="icons/${fileName}.png" style="height: 2.8em; width: auto; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));">
                    <div>
                        <span class="landmark-title" style="color: ${lmColor};">${selectedLandmark.name}</span>
                        <span style="color:#94a3b8; font-weight:bold; font-size: 0.8rem;">${selectedLandmark.type}</span>
                    </div>
                </div>
                <span class="game-coords">(${formatCoord(selectedLandmark.x)}, ${formatCoord(selectedLandmark.y)}, ${formatCoord(selectedLandmark.z)})</span>
                ${detailHtml}
            `;
            coordLabel.style.display = 'block';

        } 
        else if (markerX !== null && markerY !== null) {
            // Standard Custom Ping
            const screenX = (markerX * scale) + offsetX;
            const screenY = (markerY * scale) + offsetY;

            ctx.beginPath();
            ctx.arc(screenX, screenY, 12, 0, 2 * Math.PI);
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#4ade80';
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(screenX, screenY, 3, 0, 2 * Math.PI);
            ctx.fillStyle = '#4ade80';
            ctx.fill();

            const conversionFactor = 2 / 3;
            const gameX = currentRegion.gameStartX + (markerX * conversionFactor);
            const gameY = currentRegion.gameStartY - (markerY * conversionFactor);

            coordLabel.style.left = `${screenX + 18}px`;
            coordLabel.style.top = `${screenY - 15}px`;
            coordLabel.style.borderColor = '#4ade80';
            
            coordLabel.innerHTML = `
				<span class="game-coords">Game: (${formatCoord(gameX)}, ${formatCoord(gameY)})</span>
                <span class="img-coords">Image PX: (${Math.round(markerX)}, ${Math.round(markerY)})</span>
            `;
            coordLabel.style.display = 'block';
        } 
        else {
            coordLabel.style.display = 'none';
        }
    }

    function zoomAround(zoomFactor, centerX, centerY) {
        const oldScale = scale;
        scale = Math.min(maxScale, Math.max(minScale, scale * zoomFactor));
        const actualFactor = scale / oldScale;
        offsetX = centerX - (centerX - offsetX) * actualFactor;
        offsetY = centerY - (centerY - offsetY) * actualFactor;
        keepInBounds();
        redraw();
    }

	// ------EVENT LISTENERS------
	const video = document.getElementById('bgVideo');
	const loader = document.getElementById('loader');
	
	loader.style.display = 'flex'; 
	
	function revealDashboard() {
		loader.style.display = 'none';
		document.body.classList.add('video-loaded');
	
        if (!dashInterval) dashInterval = startCycleAnimation('dashboardDynamicContainer', false);
	}
	
	if (video.readyState >= 3) {
		revealDashboard();
	} else {
		video.addEventListener('canplaythrough', revealDashboard);
	}

    window.addEventListener('wheel', (e) => {
		if (!currentRegion) return;
		
		if (e.target.closest('#regionMenu') || e.target.closest('#autocompleteResults') || e.target.closest('#filterMenu') || e.target.closest('#layerMenu')) return;
		
		e.preventDefault();
		zoomAround(e.deltaY < 0 ? 1.15 : 0.85, e.clientX, e.clientY);
	}, { passive: false });

    window.addEventListener('pointerdown', (e) => {
		if (!currentRegion || e.clientY < 70) return; 
		
		if (e.target.closest('#regionMenu') || e.target.closest('#autocompleteResults') || e.target.closest('#filterMenu') || e.target.closest('#layerMenu')) return;
	
		isDragging = true;
		cancelAnimationFrame(panAnimId);
		dragMoveCounter = 0; 
		startX = e.clientX - offsetX;
		startY = e.clientY - offsetY;
	});

    window.addEventListener('pointermove', (e) => {
        if (!isDragging || (e.pointerType === 'touch' && e.buttons === 0)) return;
        dragMoveCounter++; 
        offsetX = e.clientX - startX;
        offsetY = e.clientY - startY;
        keepInBounds();
        redraw();
    });

    window.addEventListener('pointerup', (e) => {
        if (!currentRegion) return;

        if (e.target.closest('#filterMenu') || e.target.closest('#layerMenu') || e.target.closest('#regionMenu') || 
        e.target.closest('#autocompleteResults') || e.target.closest('.ui-panel') || e.target.closest('.btn') || 
        e.target.closest('.layer-btn')) {
            isDragging = false;
            return;
        }
        
		document.getElementById('layerMenu').style.display = 'none';
		document.getElementById('filterMenu').style.display = 'none';
		document.getElementById('regionMenu').style.display = 'none';
		document.getElementById('autocompleteResults').style.display = 'none';
		clearActivePanels();

        if (dragMoveCounter < 5) {
            const clickTolerance = 15;
        	
        	let clickedArrow = null;
			const visibleArrows = navArrows.filter(arr => 
				[].concat(arr.fromRegion).includes(currentRegion.id) && 
				arr.fromLevel.toLowerCase() === currentLayer
			);
			
			for (let arr of visibleArrows) {
				const imgX = (arr.x - currentRegion.gameStartX) * 1.5;
				const imgY = (currentRegion.gameStartY - arr.y) * 1.5;
				const screenX = (imgX * scale) + offsetX;
				const screenY = (imgY * scale) + offsetY;
				
				if (Math.hypot(e.clientX - screenX, e.clientY - screenY) <= 25) {
					clickedArrow = arr;
					break;
				}
			}
		
			if (clickedArrow) {
				executeArrowNavigation(clickedArrow);
				isDragging = false;
				return; 
			}
			
			let clickedLandmark = null;
            const visibleLandmarks = landmarks.filter(lm => 
				[].concat(lm.region).includes(currentRegion.id) &&
				lm.level.toLowerCase() === currentLayer &&
				activeFiltersByLayer[currentLayer].includes(lm.landmark) 
			);

            for (let lm of visibleLandmarks) {
                const lmImgX = (lm.x - currentRegion.gameStartX) * 1.5;
                const lmImgY = (currentRegion.gameStartY - lm.y) * 1.5;
                
                const screenX = (lmImgX * scale) + offsetX;
                const screenY = (lmImgY * scale) + offsetY;
                
                const dist = Math.hypot(e.clientX - screenX, e.clientY - screenY);
                if (dist <= clickTolerance) {
                    clickedLandmark = lm;
                    break;
                }
            }

            if (clickedLandmark) {
                selectedLandmark = clickedLandmark;
                markerX = null; 
                markerY = null;
                
                const lmImgX = (selectedLandmark.x - currentRegion.gameStartX) * 1.5;
                const lmImgY = (currentRegion.gameStartY - selectedLandmark.y) * 1.5;
                
                const tooltipShift = window.innerWidth < 600 ? 120 : 150; 
				const targetOffsetX = (window.innerWidth / 2) - tooltipShift - (lmImgX * scale);
				const targetOffsetY = (window.innerHeight / 2) - (lmImgY * scale);

                smoothPanTo(targetOffsetX, targetOffsetY);
                
            } else {
                selectedLandmark = null;
                
                // To add back the click to view coordinates functionality, just switch the commented lines below:
                
                // markerX = (e.clientX - offsetX) / scale;
                // markerY = (e.clientY - offsetY) / scale;
            	markerX = null;
                markerY = null;
                document.getElementById('coordLabel').style.display = 'none';
            } 
            redraw();
        }

        isDragging = false;
    });

    let lastPinchMidX = 0, lastPinchMidY = 0;

    window.addEventListener('touchstart', (e) => {
        if (!currentRegion) return;
        
        if (e.touches.length === 2) {
            isDragging = false;
            initialPinchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
            initialScale = scale;
            
            // Track the initial center point of the pinch gesture
            lastPinchMidX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
            lastPinchMidY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
        }
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
		if (!currentRegion) return;
		
		if (e.target.closest('#regionMenu') || e.target.closest('#autocompleteResults') || e.target.closest('#filterMenu') || e.target.closest('#layerMenu')) return;
	
		if (e.touches.length === 2) {
			e.preventDefault();
			
			const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
			const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
			const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
			
			const dx = midX - lastPinchMidX;
			const dy = midY - lastPinchMidY;
			
			offsetX += dx;
			offsetY += dy;
			zoomAround((initialScale * (dist / initialPinchDist)) / scale, midX, midY);
			lastPinchMidX = midX;
			lastPinchMidY = midY;
		}
	}, { passive: false });

    window.addEventListener('resize', () => resizeCanvas(false));
</script>
